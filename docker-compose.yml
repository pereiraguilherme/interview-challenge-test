version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-}
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-}
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend/${BACKEND_LANG:-go}
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
